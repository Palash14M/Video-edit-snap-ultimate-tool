[project]
name = "private-short-studio"
version = "0.1.0"
description = "Private, open-source video clipping and editing studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.121.3",
  "uvicorn==0.38.0",
  "python-multipart==0.0.22",
  "yt-dlp>=2025.1.26",
  "pillow>=11.3,<13",
  "fonttools>=4.60,<5",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.7"]
ai = ["faster-whisper>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["static/*"]

[tool.ruff]
target-version = "py312"
line-length = 110
