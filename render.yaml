# Optional deployment template, not a deployed/verified service.
# A free instance may not have sufficient CPU, memory, disk or runtime for videos.
# Review limits and pricing before deployment; no persistent media disk is needed.
services:
  - type: web
    name: private-short-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    numInstances: 1
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: STUDIO_HOST
        value: 0.0.0.0
      - key: STUDIO_DATA_DIR
        value: /tmp/short-studio
      # Render supplies RENDER_EXTERNAL_URL; app uses it for HTTPS origin/cookies.
      # For a custom domain only, optionally set STUDIO_PUBLIC_ORIGIN afterward.
      - key: STUDIO_PASSWORD
        generateValue: true
